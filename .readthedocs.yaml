version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - doxygen
  jobs:
    pre_build:
      - doxygen Doxyfile

sphinx:
  configuration: source/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: requirements.txt

submodules:
  include: all
  recursive: false
